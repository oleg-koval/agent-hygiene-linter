name: "Agent Hygiene Linter"
description: "Score repository hygiene for agents and humans, and optionally scaffold the missing files."
author: "Oleg Koval"

branding:
  icon: "check-circle"
  color: "green"

inputs:
  path:
    description: "Path to the repository to lint."
    required: false
    default: "."
  min-score:
    description: "Minimum hygiene score (0-100). The action exits non-zero below this."
    required: false
    default: "75"
  format:
    description: "Report format: text, markdown, or json."
    required: false
    default: "text"
  fix:
    description: 'Set to "true" to scaffold missing hygiene files instead of only reporting.'
    required: false
    default: "false"
  output-file:
    description: "If set, also write the rendered report to this file."
    required: false
    default: ""
  args:
    description: 'Extra raw CLI arguments appended verbatim (e.g. "--dry-run").'
    required: false
    default: ""
  version:
    description: "npm version or dist-tag of agent-hygiene-linter to run."
    required: false
    default: "latest"

runs:
  using: "composite"
  steps:
    - shell: bash
      env:
        AHL_VERSION: ${{ inputs.version }}
        AHL_PATH: ${{ inputs.path }}
        AHL_MIN: ${{ inputs.min-score }}
        AHL_FORMAT: ${{ inputs.format }}
        AHL_FIX: ${{ inputs.fix }}
        AHL_OUT: ${{ inputs.output-file }}
        AHL_ARGS: ${{ inputs.args }}
      run: |
        set -euo pipefail
        FLAGS=(--min-score "$AHL_MIN" --format "$AHL_FORMAT")
        if [ "$AHL_FIX" = "true" ]; then FLAGS+=(--fix); fi
        # Split extra args on whitespace without glob-expanding them (read does not glob).
        read -ra EXTRA_ARGS <<<"$AHL_ARGS"
        # Invoke the packaged file directly rather than its npm-bin symlink. The latter
        # cannot reliably identify the bundled ESM entrypoint on all runner filesystems.
        PACKAGE_DIR="$(mktemp -d)"
        trap 'rm -rf "$PACKAGE_DIR"' EXIT
        npm pack --silent "agent-hygiene-linter@${AHL_VERSION}" --pack-destination "$PACKAGE_DIR" >/dev/null
        PACKAGE_TARBALL=("$PACKAGE_DIR"/*.tgz)
        PACKAGE_ROOT="$PACKAGE_DIR/package"
        mkdir -p "$PACKAGE_ROOT"
        tar -xzf "${PACKAGE_TARBALL[0]}" -C "$PACKAGE_ROOT" --strip-components=1
        CLI_PATH="$(cd "$PACKAGE_ROOT" && pwd -P)/dist/cli.js"
        CLI=(node "$CLI_PATH" "$AHL_PATH" "${FLAGS[@]}" ${EXTRA_ARGS[@]+"${EXTRA_ARGS[@]}"})
        if [ -n "$AHL_OUT" ]; then
          "${CLI[@]}" | tee "$AHL_OUT"
        else
          "${CLI[@]}"
        fi